# Settings for the marine programme (Swedish National Monitoring Programme
# for Contaminants in Marine Biota). Update `year` each new report; other
# values change only when the method changes.

programme: marine
water_type: Marine   # value of fmcom$water_type for this programme
year: 2025           # last year of data included in the report

# Step 1: the new year's raw data. Paths are relative to the data folder
# (FMCOM_DATA_DIR, default data/). Lab file names change every year, so list
# the exact files (and versions) used for the report.
raw_data:
  # Winter conditions affect contaminant concentrations in marine biota
  exclude_winter: true
  lab_files_dir: marine/lab_files
  esbase_file: marine/esbase/Marina 2025 fiskar.xlsx
  lab_files:
    - file: Metals_Marin_260930.xlsm
    - file: Hg_Marin_261001_version 2.xlsm
    - file: MKL_Mall_Dioxins_Marin_2025.xlsm
    - file: BFRs_Marin_261014TC.xlsm
    - file: PFASs_Marin_2026_fin.xlsm
    - file: PAHs_Marin_2025_IVL.xlsm
    - file: SI_Marin_260930.xlsm
      negative_for_nondetect: false   # isotope values (d13C) are legitimately negative

harsat:
  stations_file: stations_marine.csv   # in config/harsat/
  recent_trend: 10   # years used for the "recent trend"
  # One HARSAT run per group, in this order. `fmcom`: substance groups in
  # fmcom; `harsat`: HARSAT's determinand groups (for the summary table)
  groups:
    metals:    {fmcom: [Metals], harsat: [Metals]}
    PFAS:      {fmcom: [PFAS], harsat: [Organofluorines]}
    pes_sol:   {fmcom: [Pesticides and solvents], harsat: [Chlorinated pesticides]}
    PCB_PCDDF: {fmcom: [PCBs, Dioxins and furans], harsat: [Chlorobiphenyls, Dioxins]}
    PAH:       {fmcom: [PAH], harsat: [PAH_parent]}
    BFR:       {fmcom: [BFRs], harsat: [Organobromines]}
    # Biological variables, assessed in their own run (see `biological` below)
    bio:       {harsat: [Biological], biological: true}
  # Which values go into the bio run. Age, length and weight: one value per
  # specimen. Lipid weight %: only from the dioxin lab, whose method has not
  # changed over time (the BFR lab changed in 2019/2020), in muscle and egg
  # content. Dry weight %: only from the Hg lab samples (SLU until 2006, SU
  # from 2007).
  biological:
    lipid_laboratory: UMU
    lipid_organs: [Muscle, Egg content]
    dry_weight_from: Hg   # contaminant whose lab samples give the dry weight %

# Step 2c: tables and figures for the report
tables_figures:
  # One summary table per substance and group of species
  table_groups:
    herring: [Clupea harengus]
    fish: [Perca fluviatilis, Gadus morhua, Zoarces viviparus]
    mussel: [Mytilus edulis]
    egg: [Uria aalge, Sterna hirundo, Haematopus ostralegus]
  map_species: Clupea harengus   # species shown in the mean and trend maps
  # Time series plots: x-axis ends at the report year and covers at least
  # this many years
  plot_min_years: 10
  # Station order in tables: "coast" = Bothnian Bay down the east coast, then
  # up the west coast; "latitude" = north to south
  station_order: coast

# Step 3: the report appendix. Year-specific text (citation, acknowledgements,
# introduction, method updates) is in `text_file`; edit it each year.
report:
  title: "Graphic and statistical overview of temporal trends and spatial variations in the Swedish National Monitoring Programme for Contaminants in Marine Biota (including data through {year})"
  authors:
    - "Anne L. Soerensen, Conny Jonsson, Nellie Stjärnkvist, Claudia H. Samuelsson, "
    - "and Suzanne Faxneld"
  # "Please cite as: <authors> (<year>). <title>, <publisher>."
  citation:
    authors: "Soerensen, A.L., J. C. Jonsson, N. Stjärnkvist, C.H. Samuelsson, S. Faxneld"
    year: 2026   # publication year
    publisher: "Swedish Museum of Natural History, Stockholm, Sweden"
  biota: marine          # wording in the shared text ("... in marine biota")
  text_file: 03_report/text/marine.Rmd
  thresholds_file: config/report/thresholds_marine.csv
  thresholds_note: "Sum(PBDE) in the report is the sum of five congeners (BDE-47, -99, -100, -153, -154) as BDE-28 has not been analyzed most years; the contribution of BDE-28 to the sum is typically small."
  # Parts of each substance's section, in this order: template in
  # 03_report/rmd/ and the species codes (config/lookups/species.csv) it shows
  sections:
    - {template: CLUPsection.Rmd, species: [CLUP]}
    - {template: FISHsection.Rmd, species: [GADU, ZOAR, PERC]}
    - {template: MUSSELsection.Rmd, species: [MYTI]}
    - {template: EGGsection.Rmd, species: [SIGR, HAEM, STER]}
  # No maps for these substances (no data, or mostly below LOQ)
  exclude_maps: [CR, AHCH, LINDAN, PFHXA, PFHPA, LPFBS, LPFDS, PFDS]

# Step 4: submission of the new year's data to the national database (SGU).
# Uses the lab files under raw_data:, and SGU's template in config/submission/.
submission:
  # Set by hand: 1 for the first submission; raise it only to resubmit after
  # an upload. Re-runs replace the version's files until its receipt is saved.
  version: 1
  # Folder in the SGU folder (FMCOM_SUBMISSION_DIR); output goes to
  # <folder>/<folder> <year>/v<version>/, e.g. Marina/Marina 2025/v1/
  folder: Marina
  # Often a later extract than the report's, with mussel and bird data. Same
  # format as raw_data: esbase_file:
  esbase_file: marine/esbase/Marina 2025 fiskar.xlsx
  # BESTALLARE sheet; RAPPORTNAMN is taken from report: title:
  bestallare:
    BEST_ORG: HaV
    BESTALLD_UNDERSOKNING: "Miljögifter i marin biota - insamling, provberedning, utvärdering och programkoordinering"
    UTFOR_ORG: HaV
    ORG_TYP: MYNDIG
  # Optional message to the data host (MEDDELANDE sheet), one line per row
  # (max 100 characters), e.g. why a version replaces an earlier one
  message: []
