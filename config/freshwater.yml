# Settings for the freshwater programme (Swedish National Monitoring
# Programme for Contaminants in Freshwater Biota). Placeholder until
# freshwater is moved into the shared pipeline; see freshwater_baseline/.

programme: freshwater
water_type: Freshwater   # value of fmcom$water_type for this programme
year: 2025               # last year of data included in the report

harsat:
  stations_file: stations_freshwater.csv   # not yet created
  recent_trend: 10
  groups:
    metals:    {fmcom: [Metals], harsat: [Metals]}
    PFAS:      {fmcom: [PFAS], harsat: [Organofluorines]}
    pes_sol:   {fmcom: [Pesticides and solvents], harsat: [Chlorinated pesticides]}
    PCB_PCDDF: {fmcom: [PCBs, Dioxins and furans], harsat: [Chlorobiphenyls, Dioxins]}
    BFR:       {fmcom: [BFRs], harsat: [Organobromines]}

tables_figures:
  table_groups:
    perch: [Perca fluviatilis]
    fish: [Salvelinus alpinus, Esox lucius]
  map_species: Perca fluviatilis
  plot_min_years: 10
  station_order: latitude
